<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="equipo.css" />
    <title>Primer Login</title>
</head>
<body>
    <main>
        <h1>Bienvenidos a la aplicación PLICACIÓN</h1>
        <!-- action: a quien envío | method: de qué manera, por POST o GET -->
        <form action="loginservice.php" method="POST" required>
            <!-- el for 'enlaza' un label con su input correspondiente a través del for que hace referencia al id del input -->
            <label for="idnombre">Introduce tu nombre:</label>
            <!-- placeholder son las instrucciones o ejemplo para el usuario, no se envía, solo el value -->
            <!-- required obliga a meter un valor para poder hacer submit -->
            <input type="text" id="idnombre" name="nombreusu" placeholder="Mete aquí tu nombre" required>
            <label for="code">Introduce tu código:</label>
            <!-- readonly no permite cambiar el valor, pero lo envía (porque está en value) -->
            <input type="number" id="code" name="code" readonly value="000">
            <label for="idemail">Introduce tu email:</label>
            <!-- disabled no envía el input aunque tenga value. NO ENVIA EL INPUT, es decir, el name -->
            <input type="email" id="idemail" name="emailusu" disabled value="tuemail@educantabria.es">
            <!-- tipo password para que no vea el contenido, pero se envía ok -->
            <label for="idpass">Introduce tu contraseña:</label>
            <input type="password" id="idpass" name="passusu">
            <!-- input de tipo hidden, puedo enviar el value, pero no se ve en pantalla; si en la url si es envío por GET -->
            <input type="hidden" name="datoculto" value="xxxyyy">
            <!-- submit, para enviar los datos del formulario -->
            <button type="submit">Enviar</button>
            <!-- reset, limpia los campos del formulario -->
            <button type="reset">Limpiar</button>
        </form>
    </main>
</body>
</html>
